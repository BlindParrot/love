<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Секретная игра ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Мобильная игровая зона -->
    <div class="game-wrapper" id="gameWrapper">
        <div class="score-board">Шкала любви: <span id="score">0</span> / 10 💕</div>
        
        <div class="game-area" id="gameArea">
            <!-- Сюда будут падать сердечки -->
            <div class="player-basket" id="playerBasket">🧺</div>
            
            <!-- Мобильное оверлей-меню старта -->
            <div class="start-overlay" id="startOverlay">
                <button id="startBtn">ИГРАТЬ 🎮</button>
            </div>
        </div>
        
        <div class="game-hint">Води пальцем по экрану, чтобы двигать корзинку! Лови ❤️ Избегай 💔</div>
    </div>

    <!-- Финальная карточка -->
    <div class="card main-card hidden" id="mainCard">
        <h1 id="title">Ты прошла игру! 🏆<br>А теперь главный вопрос...<br><span style="font-size: 22px; display:block; margin-top:15px; color:#ff4d6d;">Ты будешь со мной? 💖</span></h1>
        <div class="buttons">
            <button id="yesBtn">ДА! 👑</button>
            <button id="noBtn">Нет</button>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
    <script src="script.js"></script>
</body>
</html>
